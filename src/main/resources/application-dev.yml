spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}

clients:
  book-service:
    url: ${BOOK_SERVICE_URL:http://book-service:8080}
  order-service:
    url: ${ORDER_SERVICE_URL:http://order-service:8080}
  cart-service:
    url: ${CART_SERVICE_URL:http://cart-service:8080}
  promotion-service:
    url: ${PROMOTION_SERVICE_URL:http://promotion-service:8080}
  review-service:
    url: ${REVIEW_SERVICE_URL:http://review-service:8080}

ai:
  provider: ${AI_PROVIDER:groq} # gemini, groq hoac openai-compatible
  agent:
    enabled-tools: searchBooksTool,recommendationTool,compareBooksTool,reviewSummaryTool,promotionTool,categoryTool,categoryBooksTool,stockCheckTool,semanticSearchTool,imageScannerTool,guardrailTool,orderLookupTool,addToCartTool

groq:
  api:
    key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}

openai-compatible:
  api:
    key: ${AI_API_KEY:${GROQ_API_KEY:}}
  model: ${AI_MODEL:${GROQ_MODEL:deepseek-v4-flash}}
  base-url: ${AI_BASE_URL:https://ds2api-yr0a.onrender.com}
