apiVersion: v1
kind: Secret
metadata:
  name: ai-service-secret
type: Opaque
stringData:
  AI_PROVIDER: "deepseek"
  AI_API_KEY: "replace-with-ai-provider-api-key"
  GEMINI_API_KEY: "replace-with-gemini-api-key-if-needed"
  GROQ_API_KEY: "replace-with-groq-api-key-if-needed"
  DEEPSEEK_BASE_URL: "replace-with-deepseek-base-url-if-needed"
  DEEPSEEK_API_KEY: "replace-with-deepseek-api-key-if-needed"
