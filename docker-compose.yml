version: '3.8'

services:
  ai-service:
    build: 
      context: .
      target: build
    container_name: ai-service
    ports:
      - "8090:8080"
    volumes:
      - .:/build
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run -Dspring-boot.run.profiles=docker
    environment:
      SPRING_PROFILES_ACTIVE: dev
      BOOK_SERVICE_URL: http://book-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}  
    networks:
      - bookstore-network

networks:
  bookstore-network:
    external: true
